<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0c">
<title>产品成本利润计算器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{
  --bg:#0a0a0c;--card:#1c1c1e;--card2:#2c2c2e;--key:#333336;--key-press:#48484c;
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--teal:#64d2ff;--purple:#bf5af2;
  --text:#f5f5f7;--text2:#98989f;--text3:#5c5c61;
  --border:rgba(255,255,255,0.08);
  --radius:18px;
}
html,body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);
  height:100%;width:100%;overflow:hidden;position:fixed;
  touch-action:manipulation;
}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;}

/* ===== Header ===== */
.header{
  flex-shrink:0;z-index:20;
  padding:10px 18px;padding-top:max(12px,env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(10,10,12,0.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:0.5px solid var(--border);
}
.header h1{font-size:17px;font-weight:600;letter-spacing:-0.3px;}
.hdr-btn{
  background:none;border:none;color:var(--red);font-size:15px;font-weight:500;
  padding:6px 10px;border-radius:10px;cursor:pointer;font-family:inherit;
}
.hdr-btn:active{background:rgba(255,69,58,0.15);}

/* ===== Scroll body ===== */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 10px;}

/* ===== Hero result card ===== */
.hero{
  border-radius:22px;padding:20px 22px 18px;margin-bottom:14px;
  background:radial-gradient(120% 160% at 0% 0%,#16324e 0%,#101e33 45%,#121221 100%);
  border:0.5px solid rgba(120,180,255,0.18);
  box-shadow:0 12px 40px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.06);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;top:-60%;right:-20%;width:70%;height:160%;
  background:radial-gradient(closest-side,rgba(100,210,255,0.12),transparent 70%);
  pointer-events:none;
}
.hero.loss{
  background:radial-gradient(120% 160% at 0% 0%,#4e1620 0%,#33101c 45%,#1a1016 100%);
  border-color:rgba(255,120,140,0.2);
}
.hero-label{font-size:13px;font-weight:500;color:var(--text2);letter-spacing:0.2px;display:flex;align-items:center;gap:7px;}
.hero-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
.hero.loss .hero-dot{background:var(--red);box-shadow:0 0 8px var(--red);}
.hero-main{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px;}
.hero-amount{
  font-size:44px;font-weight:700;letter-spacing:-1.5px;line-height:1.05;
  font-variant-numeric:tabular-nums;color:#eafff2;
  transition:color .25s;
}
.hero.loss .hero-amount{color:#ffe3e6;}
.hero-amount .cur{font-size:24px;font-weight:600;margin-right:2px;opacity:0.7;}
.hero-badge{
  font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:5px 12px;border-radius:999px;white-space:nowrap;
  background:rgba(48,209,88,0.16);color:var(--green);
}
.hero.loss .hero-badge{background:rgba(255,69,58,0.16);color:#ff6b61;}
.hero-sub{margin-top:14px;display:flex;gap:0;border-top:0.5px solid rgba(255,255,255,0.1);padding-top:12px;}
.hero-sub-item{flex:1;min-width:0;}
.hero-sub-item+.hero-sub-item{border-left:0.5px solid rgba(255,255,255,0.1);padding-left:14px;}
.hero-sub-k{font-size:11px;color:var(--text2);margin-bottom:3px;}
.hero-sub-v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.3px;}

/* ===== Segmented control ===== */
.seg{
  display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:14px;
  border:0.5px solid var(--border);position:relative;
}
.seg-thumb{
  position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);left:3px;
  background:var(--key-press);border-radius:9px;
  box-shadow:0 2px 8px rgba(0,0,0,0.35);
  transition:transform .28s cubic-bezier(.3,.9,.3,1);
}
.seg.mode-price .seg-thumb{transform:translateX(100%);}
.seg-btn{
  flex:1;position:relative;z-index:1;background:none;border:none;color:var(--text2);
  font-size:14px;font-weight:600;padding:9px 0;cursor:pointer;font-family:inherit;
  transition:color .2s;
}
.seg-btn.on{color:var(--text);}

/* ===== Input group ===== */
.group{
  background:var(--card);border-radius:var(--radius);overflow:hidden;
  border:0.5px solid var(--border);margin-bottom:14px;
}
.field{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;cursor:pointer;position:relative;
  transition:background .15s;
}
.field+.field::before{
  content:"";position:absolute;top:0;left:16px;right:0;height:0.5px;background:var(--border);
}
.field.active{background:rgba(10,132,255,0.10);}
.field-l{display:flex;align-items:center;gap:11px;min-width:0;}
.field-ic{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.field-name{font-size:15px;font-weight:500;}
.field-hint{font-size:11px;color:var(--text3);margin-top:1px;}
.field-r{display:flex;align-items:baseline;gap:3px;flex-shrink:0;}
.field-val{
  font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.3px;
  min-width:10px;text-align:right;
}
.field-val.empty{color:var(--text3);font-weight:400;}
.field-unit{font-size:13px;color:var(--text2);font-weight:500;}
.field.active .field-val{color:var(--blue);}
.field.active .field-val::after{
  content:"";display:inline-block;width:2px;height:18px;background:var(--blue);
  margin-left:2px;vertical-align:-3px;border-radius:1px;
  animation:blink 1.1s step-end infinite;
}
@keyframes blink{50%{opacity:0}}

/* ===== Detail results ===== */
.sect-title{font-size:13px;font-weight:600;color:var(--text2);margin:0 4px 8px;letter-spacing:0.3px;}
.detail{
  background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);
  overflow:hidden;margin-bottom:14px;
}
.drow{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;position:relative;
}
.drow+.drow::before{content:"";position:absolute;top:0;left:16px;right:0;height:0.5px;background:var(--border);}
.drow-k{font-size:14px;color:var(--text2);display:flex;align-items:center;gap:8px;}
.drow-k .mini-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.drow-v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.2px;}
.drow-v.pos{color:var(--green);}
.drow-v.neg{color:#ff6b61;}
.drow-v.dim{color:var(--text2);font-weight:500;}

.warn{
  display:none;margin:-6px 4px 14px;font-size:12.5px;color:var(--orange);
  align-items:center;gap:6px;
}
.warn.show{display:flex;}

.foot-note{text-align:center;font-size:11px;color:var(--text3);padding:2px 0 10px;}

/* ===== Numpad ===== */
.pad-wrap{
  flex-shrink:0;z-index:20;
  background:rgba(16,16,18,0.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:0.5px solid var(--border);
  padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));
}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.pk{
  height:46px;border:none;border-radius:12px;cursor:pointer;font-family:inherit;
  background:var(--key);color:var(--text);
  font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 0 rgba(0,0,0,0.4);
  transition:background .08s,transform .08s;
}
.pk:active,.pk.pressed{background:var(--key-press);transform:scale(0.96);}
.pk.fn{background:#252527;color:var(--text2);font-size:17px;}
.pk.fn:active,.pk.fn.pressed{background:var(--key-press);}
.pk.go{
  grid-row:span 2;height:auto;
  background:linear-gradient(160deg,#0a84ff,#0064d2);color:#fff;font-size:16px;font-weight:600;
}
.pk.go:active,.pk.go.pressed{filter:brightness(1.2);transform:scale(0.97);}
.pk.done{background:#3a3a3e;color:var(--teal);font-size:15px;font-weight:600;}

::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div id="app">

  <div class="header">
    <h1>成本利润计算器</h1>
    <button class="hdr-btn" id="resetBtn">重置</button>
  </div>

  <div class="body" id="body">

    <div class="hero" id="hero">
      <div class="hero-label"><span class="hero-dot"></span><span id="heroLabel">每件净利润</span></div>
      <div class="hero-main">
        <div class="hero-amount" id="heroAmount"><span class="cur">¥</span>0.00</div>
        <div class="hero-badge" id="heroBadge">利润率 0%</div>
      </div>
      <div class="hero-sub">
        <div class="hero-sub-item">
          <div class="hero-sub-k" id="sub1k">总利润</div>
          <div class="hero-sub-v" id="sub1v">¥0.00</div>
        </div>
        <div class="hero-sub-item">
          <div class="hero-sub-k" id="sub2k">总收入</div>
          <div class="hero-sub-v" id="sub2v">¥0.00</div>
        </div>
        <div class="hero-sub-item">
          <div class="hero-sub-k" id="sub3k">总成本</div>
          <div class="hero-sub-v" id="sub3v">¥0.00</div>
        </div>
      </div>
    </div>

    <div class="seg" id="seg">
      <div class="seg-thumb"></div>
      <button class="seg-btn on" data-mode="profit">算利润</button>
      <button class="seg-btn" data-mode="price">算定价</button>
    </div>

    <div class="warn" id="warn">⚠️ <span id="warnText"></span></div>

    <div class="group" id="fields"></div>

    <div class="sect-title">明细</div>
    <div class="detail" id="detail"></div>

    <div class="foot-note">数据自动保存在本机 · 点击输入项后用下方键盘输入</div>
  </div>

  <div class="pad-wrap">
    <div class="pad" id="pad">
      <button class="pk" data-k="7">7</button>
      <button class="pk" data-k="8">8</button>
      <button class="pk" data-k="9">9</button>
      <button class="pk fn" data-k="clear">C</button>
      <button class="pk" data-k="4">4</button>
      <button class="pk" data-k="5">5</button>
      <button class="pk" data-k="6">6</button>
      <button class="pk fn" data-k="del">⌫</button>
      <button class="pk" data-k="1">1</button>
      <button class="pk" data-k="2">2</button>
      <button class="pk" data-k="3">3</button>
      <button class="pk go" data-k="next">下一项</button>
      <button class="pk" data-k="0" style="grid-column:span 2">0</button>
      <button class="pk" data-k=".">.</button>
    </div>
  </div>

</div>

<script>
'use strict';

// ====== Field definitions ======
const FIELDS = {
  cost:   {name:'进货成本', hint:'单件采购 / 原料成本', unit:'元', icon:'📦', ibg:'rgba(10,132,255,0.18)',  ph:'0'},
  extra:  {name:'其他费用', hint:'单件运费 / 包装 / 损耗', unit:'元', icon:'🚚', ibg:'rgba(255,159,10,0.18)', ph:'0'},
  feePct: {name:'平台费率', hint:'抽成 / 支付手续费', unit:'%', icon:'🏪', ibg:'rgba(191,90,242,0.18)', ph:'0'},
  price:  {name:'销售单价', hint:'实际对外售价', unit:'元', icon:'🏷️', ibg:'rgba(48,209,88,0.18)',  ph:'0'},
  margin: {name:'目标利润率', hint:'期望净利润 ÷ 售价', unit:'%', icon:'🎯', ibg:'rgba(48,209,88,0.18)',  ph:'0'},
  qty:    {name:'销售数量', hint:'预计销量', unit:'件', icon:'🔢', ibg:'rgba(100,210,255,0.18)', ph:'1'},
};
const MODE_FIELDS = {
  profit: ['cost','extra','feePct','price','qty'],
  price:  ['cost','extra','feePct','margin','qty'],
};

// ====== State ======
const LS_KEY = 'profitCalcV1';
let state = {mode:'profit', vals:{cost:'',extra:'',feePct:'',price:'',margin:'',qty:''}};
try{
  const saved = JSON.parse(localStorage.getItem(LS_KEY));
  if(saved && saved.vals) state = {mode: saved.mode==='price'?'price':'profit', vals:{...state.vals,...saved.vals}};
}catch(e){}
let activeField = MODE_FIELDS[state.mode][0];
let firstKeyOnField = true;   // first digit replaces existing value (iOS-style)

function persist(){ try{localStorage.setItem(LS_KEY, JSON.stringify(state));}catch(e){} }

// ====== Helpers ======
function num(key){
  const v = parseFloat(state.vals[key]);
  return isFinite(v) ? v : 0;
}
function fmt(n, d=2){
  if(!isFinite(n)) return '—';
  const abs = Math.abs(n);
  const dec = abs >= 100000 ? 0 : d;
  return n.toLocaleString('zh-CN', {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function money(n){ return (n<0?'-¥':'¥') + fmt(Math.abs(n)); }
function pct(n){ return fmt(n,1) + '%'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ====== Core calculation ======
function calc(){
  const cost = num('cost'), extra = num('extra'), fee = num('feePct')/100, qty = Math.max(num('qty'), 0) || 1;
  const r = {feasible:true, qty};
  if(state.mode === 'profit'){
    r.price = num('price');
  }else{
    const margin = num('margin')/100;
    const denom = 1 - fee - margin;
    if(denom <= 0){
      r.feasible = false;
      r.price = NaN;
    }else{
      r.price = (cost + extra) / denom;
    }
  }
  if(fee >= 1) r.feasible = false;
  const p = r.price;
  r.feeAmt    = isFinite(p) ? p * fee : NaN;            // 单件平台扣费
  r.unitCost  = cost + extra + (isFinite(r.feeAmt)?r.feeAmt:0); // 单件总成本
  r.unitProfit= isFinite(p) ? p - r.unitCost : NaN;     // 单件净利润
  r.marginPct = (isFinite(p) && p > 0) ? r.unitProfit / p * 100 : NaN;       // 利润率（销售）
  r.markupPct = (cost + extra) > 0 ? r.unitProfit / (cost + extra) * 100 : NaN; // 成本加价率
  r.breakeven = fee < 1 ? (cost + extra) / (1 - fee) : NaN;  // 保本售价
  r.revenue   = isFinite(p) ? p * qty : NaN;
  r.totalCost = isFinite(p) ? r.unitCost * qty : NaN;
  r.totalProfit = isFinite(p) ? r.unitProfit * qty : NaN;
  return r;
}

// ====== Render: fields ======
function renderFields(){
  const keys = MODE_FIELDS[state.mode];
  if(!keys.includes(activeField)) activeField = keys[0];
  document.getElementById('fields').innerHTML = keys.map(k=>{
    const f = FIELDS[k];
    const raw = state.vals[k];
    const has = raw !== '';
    return `<div class="field${k===activeField?' active':''}" data-f="${k}">
      <div class="field-l">
        <div class="field-ic" style="background:${f.ibg}">${f.icon}</div>
        <div><div class="field-name">${esc(f.name)}</div><div class="field-hint">${esc(f.hint)}</div></div>
      </div>
      <div class="field-r">
        <div class="field-val${has?'':' empty'}">${has?esc(raw):f.ph}</div>
        <div class="field-unit">${f.unit}</div>
      </div>
    </div>`;
  }).join('');
}

// ====== Render: results ======
function cls(v){ return v > 0.005 ? 'pos' : (v < -0.005 ? 'neg' : 'dim'); }

function renderResults(){
  const r = calc();
  const hero = document.getElementById('hero');
  const isPriceMode = state.mode === 'price';
  const warn = document.getElementById('warn');

  if(!r.feasible){
    warn.classList.add('show');
    document.getElementById('warnText').textContent = isPriceMode
      ? '平台费率 + 目标利润率 ≥ 100%，无法定价，请调低'
      : '平台费率 ≥ 100%，请检查输入';
  }else{
    warn.classList.remove('show');
  }

  hero.classList.toggle('loss', r.feasible && isFinite(r.unitProfit) && r.unitProfit < -0.005);

  if(isPriceMode){
    document.getElementById('heroLabel').textContent = '建议销售单价';
    document.getElementById('heroAmount').innerHTML = '<span class="cur">¥</span>' + (r.feasible?fmt(r.price):'—');
    document.getElementById('heroBadge').textContent = '每件赚 ' + (r.feasible?money(r.unitProfit):'—');
  }else{
    document.getElementById('heroLabel').textContent = '每件净利润';
    const neg = r.unitProfit < 0;
    document.getElementById('heroAmount').innerHTML =
      '<span class="cur">' + (neg?'-¥':'¥') + '</span>' + fmt(Math.abs(r.unitProfit));
    document.getElementById('heroBadge').textContent = '利润率 ' + (isFinite(r.marginPct)?pct(r.marginPct):'—');
  }
  document.getElementById('sub1v').textContent = isFinite(r.totalProfit)?money(r.totalProfit):'—';
  document.getElementById('sub2v').textContent = isFinite(r.revenue)?money(r.revenue):'—';
  document.getElementById('sub3v').textContent = isFinite(r.totalCost)?money(r.totalCost):'—';

  const rows = [
    ['单件总成本', money(r.unitCost), 'dim', 'var(--orange)'],
    ['其中平台扣费', isFinite(r.feeAmt)?money(r.feeAmt)+' /件':'—', 'dim', 'var(--purple)'],
    ['保本售价', isFinite(r.breakeven)?money(r.breakeven):'—', 'dim', 'var(--teal)'],
    ['单件净利润', isFinite(r.unitProfit)?money(r.unitProfit):'—', cls(r.unitProfit), 'var(--green)'],
    ['销售利润率', isFinite(r.marginPct)?pct(r.marginPct):'—', cls(r.unitProfit), 'var(--green)'],
    ['成本加价率', isFinite(r.markupPct)?pct(r.markupPct):'—', cls(r.unitProfit), 'var(--blue)'],
  ];
  document.getElementById('detail').innerHTML = rows.map(([k,v,c,dot])=>
    `<div class="drow">
      <div class="drow-k"><span class="mini-dot" style="background:${dot}"></span>${k}</div>
      <div class="drow-v ${c}">${v}</div>
    </div>`).join('');
}

function renderAll(){ renderFields(); renderResults(); }

// ====== Field selection ======
document.getElementById('fields').addEventListener('click', e=>{
  const el = e.target.closest('.field');
  if(!el) return;
  activeField = el.dataset.f;
  firstKeyOnField = true;
  renderFields();
});

// ====== Segmented control ======
document.getElementById('seg').addEventListener('click', e=>{
  const btn = e.target.closest('.seg-btn');
  if(!btn || btn.dataset.mode === state.mode) return;
  state.mode = btn.dataset.mode;
  document.getElementById('seg').classList.toggle('mode-price', state.mode==='price');
  document.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('on', b.dataset.mode===state.mode));
  activeField = MODE_FIELDS[state.mode][0];
  firstKeyOnField = true;
  persist();
  renderAll();
});

// ====== Numpad ======
function inputKey(k){
  const cur = state.vals[activeField] || '';
  let next = cur;

  if(k === 'clear'){
    next = '';
  }else if(k === 'del'){
    next = cur.slice(0,-1);
    firstKeyOnField = false;
  }else if(k === 'next'){
    const keys = MODE_FIELDS[state.mode];
    activeField = keys[(keys.indexOf(activeField)+1) % keys.length];
    firstKeyOnField = true;
    renderFields();
    return;
  }else if(k === '.'){
    if(firstKeyOnField){ next = '0.'; }
    else if(!cur.includes('.')) next = (cur||'0') + '.';
    firstKeyOnField = false;
  }else{ // digit
    next = firstKeyOnField ? k : cur + k;
    firstKeyOnField = false;
    if(next.length > 10) return;
    if(/^0\d/.test(next)) next = next.slice(1); // 03 -> 3
  }

  state.vals[activeField] = next;
  persist();
  renderAll();
}

const pad = document.getElementById('pad');
let padTouched = false;
pad.addEventListener('touchend', e=>{
  const btn = e.target.closest('.pk');
  if(!btn) return;
  e.preventDefault();
  padTouched = true;
  btn.classList.add('pressed');
  setTimeout(()=>btn.classList.remove('pressed'), 110);
  inputKey(btn.dataset.k);
}, {passive:false});
pad.addEventListener('click', e=>{
  if(padTouched){ padTouched = false; return; }
  const btn = e.target.closest('.pk');
  if(btn) inputKey(btn.dataset.k);
});

// Hardware keyboard support (desktop)
document.addEventListener('keydown', e=>{
  if(e.key >= '0' && e.key <= '9') inputKey(e.key);
  else if(e.key === '.') inputKey('.');
  else if(e.key === 'Backspace') inputKey('del');
  else if(e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); inputKey('next'); }
  else if(e.key === 'Escape') inputKey('clear');
});

// ====== Reset ======
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(!confirm('清空所有输入？')) return;
  state.vals = {cost:'',extra:'',feePct:'',price:'',margin:'',qty:''};
  activeField = MODE_FIELDS[state.mode][0];
  firstKeyOnField = true;
  persist();
  renderAll();
});

// ====== Init ======
document.getElementById('seg').classList.toggle('mode-price', state.mode==='price');
document.querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('on', b.dataset.mode===state.mode));
renderAll();
</script>
</body>
</html>
